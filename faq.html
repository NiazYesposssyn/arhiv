<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAQ - Archive Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site-static.css">
</head>
<body>
  <header data-public-nav></header>
  <main>
    <section class="page-hero"><div class="container"><span class="eyebrow">FAQ</span><h1>Жиі қойылатын сұрақтар</h1><p class="lead">Поиск по вопросам, категории и раскрывающиеся ответы.</p></div></section>
    <section class="section">
      <div class="container">
        <input data-faq-search placeholder="Сұрақты іздеу...">
        <div style="margin-top:20px">
          <div class="card faq-item" data-faq-item><button class="btn btn-soft faq-question" data-faq-question><span><span class="badge">Құжаттар</span> Қандай файл түрлері қолданылады?</span><span>+</span></button><p class="muted faq-answer">PDF, DOCX, XLSX, JPG және PNG файлдарын тіркеуге болады.</p></div>
          <div class="card faq-item" data-faq-item><button class="btn btn-soft faq-question" data-faq-question><span><span class="badge">Сұраныстар</span> Өтінім статусын қалай көремін?</span><span>+</span></button><p class="muted faq-answer">Requests бөлімінде статус, комментарий және тарих көрсетіледі.</p></div>
          <div class="card faq-item" data-faq-item><button class="btn btn-soft faq-question" data-faq-question><span><span class="badge">Қауіпсіздік</span> Жүйеде қандай қорғаныс бар?</span><span>+</span></button><p class="muted faq-answer">JWT authentication, рөлдер, 2FA, audit logs және backup бар.</p></div>
        </div>
      </div>
    </section>
  </main>
  <div data-footer></div>
  <script src="assets/app-static.js"></script>
</body>
</html>
